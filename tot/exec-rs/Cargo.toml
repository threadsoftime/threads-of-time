[package]
name = "exec-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "exec_rs"
path = "src/lib.rs"

[[bin]]
name = "exec-rs"
path = "src/main.rs"

# tokio / tracing / tracing-subscriber are staged for the future `main.rs` graceful-shutdown
# binary and are not used by the M0 library yet. reqwest is purely transitive via
# tot-harness-client (which owns all HTTP) and is therefore not listed here.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tot-harness-client = { path = "../tot-harness-client" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

# [profile.release] intentionally absent — the workspace root Cargo.toml owns the
# shared release profile (opt-level="z", lto, codegen-units=1, strip, panic=abort).
# Individual crates must NOT define their own [profile.*].

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
