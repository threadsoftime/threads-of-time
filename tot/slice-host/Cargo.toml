[package]
name = "slice-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "slice-host"
path = "src/main.rs"

[dependencies]
# Strangler-fig slices hosted here.
game-event-scheduler = { path = "../game-event-scheduler" }
lfg-matchmaker = { path = "../lfg-matchmaker" }

# Async runtime + HTTP server.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum = "0.7"

# Observability: a single global tracing subscriber for the whole host, so the
# hosted slices' `tracing` events (e.g. lfg-matchmaker's per-tick span) are
# actually emitted in the deployed service. Filtered via RUST_LOG.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
