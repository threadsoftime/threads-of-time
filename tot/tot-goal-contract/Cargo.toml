[package]
name = "tot-goal-contract"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

# [profile.*] intentionally absent — the workspace root owns the shared release profile.

[dev-dependencies]
# serde_json is only used by the test modules (the types derive serde, not serde_json).
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
