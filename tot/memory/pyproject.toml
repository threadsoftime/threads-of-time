[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tot-memory"
version = "1.0.0-dev"
description = "Threads of Time V3 memory subsystem"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
]

[project.scripts]
tot-memory = "tot_memory.__main__:main"

[tool.hatch.build]
packages = ["src/tot_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Phase 8 eval gate is slow (~seconds; seeds 200 episodes + runs 50 recalls).
# Default `pytest` skips it; run explicitly with `pytest -m eval`.
markers = [
    "eval: quality-gate eval suite for hybrid retrieval (subspec §12.2)",
]
addopts = "-m 'not eval'"
