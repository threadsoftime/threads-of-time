[workspace]
resolver = "2"
# All strangler-fig slices in one workspace. The shared release profile below
# applies to all members; individual crates must NOT define their own [profile.*].
members = [
    "brain-rs",
    "game-event-scheduler",
    "harness-rs",
    "lfg-matchmaker",
    "memory-rs",
    "slice-host",
    "tot-harness-client",
    "tot-mcp-bearer-auth",
    "tot-schema-transform",
]

# Shared release profile: minimal-footprint single static binary (Steam Deck).
# panic=abort affects release only; dev/test still unwind so #[should_panic]
# and assertion panics behave normally.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
