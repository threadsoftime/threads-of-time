[workspace]
resolver = "2"
# Explicit members — NOT a glob. tot/lfg-matchmaker (the LFG strangler-fig slice,
# merged in on the rust-refactor branch) is intentionally NOT a member yet: it is a
# standalone crate with its own [profile.release] (its own workspace). Folding it in
# as a third member + hosting it under slice-host (see slice-host/src/main.rs seam)
# is the next consolidation step.
members = [
    "game-event-scheduler",
    "slice-host",
]
# Excluded (not a member yet) so it keeps building standalone with its own
# Cargo.lock + [profile.release]. Without this, the parent workspace makes it an
# orphan ("believes it's in a workspace when it's not"). Drop this + add it to
# members when it's folded into the host.
exclude = [
    "lfg-matchmaker",
]

# Shared release profile: minimal-footprint single static binary (Steam Deck).
# panic=abort affects release only; dev/test still unwind so #[should_panic]
# and assertion panics behave normally.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
