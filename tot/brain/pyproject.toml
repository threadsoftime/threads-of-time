[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-sidecar"
version = "0.1.0"
description = "V3 autonomous-decision brain for mod-playerbots living-character bots"
license = {text = "AGPL-3.0"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "mcp>=1.27.1",
    "anyio>=4.12.1,<4.13.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["brain_sidecar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: tests that require live harness:8099 + memory:8090 (skipped by default)",
    "live_server: tests that require a live ToT worldserver + harness daemon (skipped by default)",
    "warforged: mod-warforged integration tests (subset of live_server-marked tests)",
]
addopts = "-m 'not contract and not live_server'"

[tool.ruff]
line-length = 100
target-version = "py312"
