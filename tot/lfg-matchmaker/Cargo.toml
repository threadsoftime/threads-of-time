[package]
name = "lfg-matchmaker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Minimal-footprint single static binary for small always-on systems (Steam Deck).
# panic=abort affects release only; dev/test still unwind so #[should_panic] / test
# assertion panics behave normally.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
