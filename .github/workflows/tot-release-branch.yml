name: ToT Release Branch
# Builds + pushes harness/brain/memory rc images on push to release/* branches.
# worldserver + authserver + db-import are built on-demand via tot/release/build.sh
# (the -j4 build-host step) and pushed by release.sh.
# A self-hosted runner for the C++ worldserver build is deferred to 1.1.0.
on:
  push:
    branches: ['release/**']
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        svc: [harness, brain, memory]
    steps:
      - uses: actions/checkout@v4
      - name: Derive version
        run: echo "VER=$(echo "${GITHUB_REF_NAME#release/}")-rc" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build + push ${{ matrix.svc }}
        run: |
          docker build -t ghcr.io/threadsoftime/${{ matrix.svc }}:$VER \
            -f tot/${{ matrix.svc }}/Containerfile tot/${{ matrix.svc }}
          docker push ghcr.io/threadsoftime/${{ matrix.svc }}:$VER
